# Fly.io configuration for HumanCompiler API
app = "humancompiler-api-masa"
primary_region = "nrt"  # Tokyo region for lower latency

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PYTHONPATH = "/app/src"
  ENVIRONMENT = "production"
  DEBUG = "false"
  # Trust the Fly edge for X-Forwarded-* (read by uvicorn, see Dockerfile).
  # Client IPs come from Fly-Client-IP, not X-Forwarded-For (Issue #358).
  FORWARDED_ALLOW_IPS = "*"

# Production runs on exactly one Machine (`fly scale count 1`). Per-process
# state assumes it: WebSocket connections for checkout notifications, the
# APScheduler jobs and the in-memory rate-limit counters. A second Machine
# would split them (see #56). bluegreen starts the new Machine and waits for
# its health check before stopping the old one, so a deploy has no downtime.
[deploy]
  strategy = "bluegreen"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false  # Keep production always running for better performance
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  # Health checks enabled for production stability
  [[http_service.checks]]
    interval = "30s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/health"
    protocol = "http"
    tls_skip_verify = false

[machines]
  [[machines.mounts]]
    source = "humancompiler_data"
    destination = "/app/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Database and secrets configuration
# Set these with: fly secrets set KEY=VALUE
# Required secrets:
# - DATABASE_URL
# - SUPABASE_URL
# - SUPABASE_KEY
# - SUPABASE_SERVICE_ROLE_KEY
# - ENCRYPTION_SALT
