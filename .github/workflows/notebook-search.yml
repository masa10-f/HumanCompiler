name: Notebook search migration

on:
  pull_request:
    paths:
      - 'apps/api/src/humancompiler_api/routers/daily_plans.py'
      - 'apps/api/migrations/029*'
      - 'apps/api/tests/test_daily_plan_search_postgres.py'
      - '.github/workflows/notebook-search.yml'

permissions:
  contents: read

jobs:
  postgres-search:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: notebook_test
          POSTGRES_PASSWORD: notebook_test
          POSTGRES_DB: notebook_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notebook_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v5
      - name: Install API test dependencies
        working-directory: apps/api
        run: |
          uv venv
          uv pip install -e ".[dev]"
      - name: Check PostgreSQL backfill, mirror parity, triggers and rollback
        working-directory: apps/api
        env:
          NOTEBOOK_TEST_POSTGRES_URL: postgresql://notebook_test:notebook_test@localhost:5432/notebook_test
        run: uv run pytest -q tests/test_daily_plan_search_postgres.py
